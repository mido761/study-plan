<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark" style="color-scheme: dark;"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابع مذاكرة الأزهر - أولى ثانوي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Cairo:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12312c;
    --ink-soft:#3c554f;
    --gold:#a9772f;
    --gold-soft:#cf9c4e;
    --paper:#f6f1e4;
    --paper-raised:#fffdf7;
    --line:#ddd2b4;
    --done:#3e7d54;
    --done-bg:#e4efe2;
    --progress:#b57a23;
    --progress-bg:#f3e6cc;
    --idle:#8a8070;
    --idle-bg:#eee8d9;
    --danger:#a13b30;
    --shadow: 0 1px 2px rgba(18,49,44,.06), 0 6px 18px rgba(18,49,44,.07);
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;
    color-scheme: light;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark){
      --ink:#eee6d2;
      --ink-soft:#c9bfa4;
      --gold:#e0ab5a;
      --gold-soft:#c98f3c;
      --paper:#181510;
      --paper-raised:#221e17;
      --line:#39332a;
      --done:#7fbf8f;
      --done-bg:#1d2b1e;
      --progress:#e0ab5a;
      --progress-bg:#2c2415;
      --idle:#8f8570;
      --idle-bg:#221e17;
      --danger:#d6776a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#eee6d2;
    --ink-soft:#c9bfa4;
    --gold:#e0ab5a;
    --gold-soft:#c98f3c;
    --paper:#181510;
    --paper-raised:#221e17;
    --line:#39332a;
    --done:#7fbf8f;
    --done-bg:#1d2b1e;
    --progress:#e0ab5a;
    --progress-bg:#2c2415;
    --idle:#8f8570;
    --idle-bg:#221e17;
    --danger:#d6776a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Cairo","Segoe UI",Tahoma,sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  h1,h2,h3{font-family:"Amiri","Traditional Arabic",serif; margin:0;}
  ::selection{background:var(--gold-soft); color:#fff;}

  /* ---- App shell ---- */
  #app{max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}

  header.top{
    position:sticky; top:0; z-index:20;
    padding:calc(18px + env(safe-area-inset-top,0px)) 18px 16px;
    background:linear-gradient(180deg, var(--ink) 0%, #1a453e 100%);
    color:#f6f1e4;
    border-bottom:3px solid var(--gold);
  }
  :root[data-theme="dark"] header.top, :root:not([data-theme="light"]) header.top{
    background:linear-gradient(180deg,#0d211d 0%,#122e28 100%);
  }
  @media (prefers-color-scheme: dark){ header.top{ background:linear-gradient(180deg,#0d211d 0%,#122e28 100%);} }
  header.top .crumb{font-size:12.5px; letter-spacing:.02em; color:#cfe3da; opacity:.85; margin-bottom:4px;}
  header.top h1{font-size:22px; font-weight:700; color:#fff; line-height:1.35;}
  header.top .sub{font-size:13px; color:#cfe3da; margin-top:4px;}

  .overall-wrap{display:flex; align-items:center; gap:14px; margin-top:16px;}
  .ring{width:64px; height:64px; flex:none;}
  .overall-text{flex:1;}
  .overall-text .pct{font-size:26px; font-weight:800; color:#fff; font-family:"Amiri",serif;}
  .overall-text .lbl{font-size:12.5px; color:#cfe3da;}

  nav.tabs{
    display:flex; gap:6px; padding:6px; margin:14px 16px 0;
    background:rgba(0,0,0,.18); border-radius:999px;
  }
  nav.tabs button{
    flex:1; border:0; background:transparent; color:#e7ddc3; font-family:inherit;
    font-size:13.5px; font-weight:600; padding:9px 6px; border-radius:999px; cursor:pointer;
  }
  nav.tabs button.active{background:var(--gold); color:#20180a;}

  main{flex:1; padding:16px 16px 90px;}
  .view{display:none;}
  .view.active{display:block;}

  /* ---- Dashboard ---- */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .stat-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:14px; box-shadow:var(--shadow);
  }
  .stat-card .n{font-family:"Amiri",serif; font-size:24px; font-weight:700; color:var(--ink);}
  .stat-card .t{font-size:12px; color:var(--ink-soft); margin-top:2px;}

  .section-title{font-size:15px; font-weight:700; color:var(--ink); margin:22px 0 10px; display:flex; align-items:center; gap:8px;}
  .section-title .rule{flex:1; height:1px; background:var(--line);}

  .subject-row{
    display:flex; align-items:center; gap:12px; padding:12px 10px; border-radius:var(--radius-md);
    background:var(--paper-raised); border:1px solid var(--line); margin-bottom:8px; cursor:pointer;
  }
  .badge{
    width:38px; height:38px; border-radius:11px; flex:none; display:flex; align-items:center; justify-content:center;
    font-family:"Amiri",serif; font-weight:700; font-size:16px; color:#fff;
  }
  .subject-row .info{flex:1; min-width:0;}
  .subject-row .name{font-size:14.5px; font-weight:700; color:var(--ink);}
  .subject-row .meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .bar{height:6px; border-radius:4px; background:var(--idle-bg); margin-top:7px; overflow:hidden;}
  .bar > i{display:block; height:100%; background:var(--done); border-radius:4px;}
  .chev{color:var(--ink-soft); font-size:13px;}

  /* ---- Lessons view ---- */
  .filter-row{display:flex; gap:7px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px; -ms-overflow-style:none; scrollbar-width:none;}
  .filter-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:none; border:1px solid var(--line); background:var(--paper-raised); color:var(--ink-soft);
    font-family:inherit; font-size:12.5px; font-weight:600; padding:7px 13px; border-radius:999px; cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{background:var(--ink); color:#f6f1e4; border-color:var(--ink);}

  .subject-group{margin-bottom:20px;}
  .subject-group-head{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .subject-group-head .name{font-size:15px; font-weight:700; font-family:"Amiri",serif;}
  .subject-group-head .frac{margin-inline-start:auto; font-size:12px; color:var(--ink-soft);}

  .lesson{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:11px 12px; margin-bottom:7px;
  }
  .lesson .top-row{display:flex; align-items:flex-start; gap:10px;}
  .lesson .week{
    flex:none; font-size:10.5px; font-weight:700; color:var(--gold); background:var(--progress-bg);
    padding:3px 7px; border-radius:6px; margin-top:1px; white-space:nowrap;
  }
  .lesson .title{flex:1; font-size:13.5px; line-height:1.5; color:var(--ink);}
  .lesson .status-row{display:flex; gap:7px; margin-top:9px;}
  .status-btn{
    flex:1; border:1px solid var(--line); border-radius:8px; padding:7px 4px; font-family:inherit;
    font-size:11.5px; font-weight:600; cursor:pointer; text-align:center; background:var(--idle-bg); color:var(--idle);
  }
  .status-btn[data-state="in_progress"]{background:var(--progress-bg); color:var(--progress); border-color:transparent;}
  .status-btn[data-state="done"]{background:var(--done-bg); color:var(--done); border-color:transparent;}
  .status-btn .k{opacity:.7; font-weight:500;}

  /* ---- Schedule view ---- */
  .day-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:14px;}
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-btn{
    flex:none; border:1px solid var(--line); background:var(--paper-raised); color:var(--ink-soft);
    font-family:inherit; font-size:12.5px; font-weight:700; padding:9px 14px; border-radius:12px; cursor:pointer;
  }
  .day-btn.active{background:var(--ink); color:#f6f1e4; border-color:var(--ink);}

  .slot{
    display:flex; gap:12px; padding:13px 0; border-bottom:1px solid var(--line);
  }
  .slot:last-child{border-bottom:0;}
  .slot .time{
    flex:none; width:84px; font-size:11.5px; color:var(--ink-soft); font-weight:600; line-height:1.5; padding-top:1px;
  }
  .slot .stripe{width:3px; border-radius:3px; flex:none; align-self:stretch;}
  .slot .body{flex:1; min-width:0;}
  .slot .subj{font-size:14px; font-weight:700; color:var(--ink);}
  .slot .dur{display:inline-block; font-size:10.5px; color:var(--gold); background:var(--progress-bg); border-radius:6px; padding:1px 7px; margin-inline-start:6px; font-weight:700; vertical-align:middle;}
  .slot .activity{font-size:12.5px; color:var(--ink-soft); margin-top:4px; line-height:1.5;}
  .slot .note{font-size:11.5px; color:var(--gold); margin-top:4px;}
  .day-note{
    background:var(--progress-bg); color:var(--ink); border-radius:var(--radius-md); padding:12px 14px;
    font-size:12.5px; margin-top:14px; line-height:1.6; border:1px dashed var(--gold-soft);
  }

  footer.bottom{display:none;}
  .empty{text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 10px;}
</style>
</head>

  <header class="top">
    <div class="crumb">المعاهد الأزهرية · الصف الأول الثانوي · بكالوريا 2027</div>
    <h1>برنامج المذاكرة التفاعلي</h1>

  <main>

    <section id="view-lessons" class="view"></section>

  </main>

</div>

    var migrated = {};
    Object.keys(state.lessonStatus).forEach(function(key){
      var m = key.match(/^([a-z]+)-(\d+)$/);
      if(!m){ migrated[key] = state.lessonStatus[key]; return; }

    html += '</div>';

    html += '<div class="section-title">نسبة الإنجاز حسب المادة<span class="rule"></span></div>';
    SUBJECTS.forEach(function(s){
      var st = subjectStats(s.id);
      var pct = st.total ? Math.round((st.done/st.total)*100) : 0;
      html += '<div class="subject-row" data-open-subject="'+s.id+'">';
      html += '  <div class="badge" style="background:'+s.color+'">'+s.name.charAt(0)+'</div>';
      html += '  <div class="info">';
      html += '    <div class="name">'+s.name+'</div>';
      html += '    <div class="meta">'+arabicPct(st.done)+' / '+arabicPct(st.total)+' درساً — '+arabicPct(pct)+'٪</div>';
      html += '    <div class="bar"><i style="width:'+pct+'%; background:'+s.color+'"></i></div>';
      html += '  </div>';
      html += '  <div class="chev">‹</div>';
      html += '</div>';
    });
    document.getElementById("view-dashboard").innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll("[data-open-subject]"), function(el){
      el.addEventListener("click", function(){
        ui.tab = "lessons";
        ui.lessonFilter = el.getAttribute("data-open-subject");
        renderAll();
      });
    });
  }

  /* ============ RENDER: lessons ============ */
  function renderLessons(){
    var html = '<div class="filter-row">';
    html += '<button class="chip'+(ui.lessonFilter==="all"?" active":"")+'" data-filter="all">كل المواد</button>';
    SUBJECTS.forEach(function(s){
      html += '<button class="chip'+(ui.lessonFilter===s.id?" active":"")+'" data-filter="'+s.id+'">'+s.name+'</button>';
    });
    html += '</div>';

    var subjectsToShow = ui.lessonFilter==="all" ? SUBJECTS : SUBJECTS.filter(function(s){ return s.id===ui.lessonFilter; });

    subjectsToShow.forEach(function(s){
      var ls = lessonsFor(s.id);
      var st = subjectStats(s.id);
      html += '<div class="subject-group">';
      html += '  <div class="subject-group-head"><div class="badge" style="width:28px;height:28px;font-size:13px;background:'+s.color+'">'+s.name.charAt(0)+'</div>';
      html += '  <div class="name">'+s.name+'</div><div class="frac">'+arabicPct(st.done)+' / '+arabicPct(st.total)+'</div></div>';
      ls.forEach(function(l){
        var stt = state.lessonStatus[l.id];
        html += '<div class="lesson">';
        html += '  <div class="top-row"><span class="week">أسبوع '+arabicPct(l.week)+'</span><span class="title">'+l.title+'</span></div>';
        html += '  <div class="status-row">';
        html += '    <button class="status-btn" data-lesson="'+l.id+'" data-kind="study" data-state="'+stt.study+'"><span class="k">المذاكرة: </span>'+STUDY_LABELS[stt.study]+'</button>';
        html += '    <button class="status-btn" data-lesson="'+l.id+'" data-kind="review" data-state="'+stt.review+'"><span class="k">المراجعة: </span>'+REVIEW_LABELS[stt.review]+'</button>';
        html += '  </div>';
        html += '</div>';
      });
      html += '</div>';
    });

    document.getElementById("view-lessons").innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll("[data-filter]"), function(el){
      el.addEventListener("click", function(){
        ui.lessonFilter = el.getAttribute("data-filter");
        renderLessons();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".status-btn"), function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-lesson");
        var kind = el.getAttribute("data-kind");
        var cur = state.lessonStatus[id][kind];
        var next = CYCLE[(CYCLE.indexOf(cur)+1) % CYCLE.length];
        state.lessonStatus[id][kind] = next;
        renderLessons();
        renderHeader();
        schedulePublish();
      });
    });
  }

  /* ============ RENDER: schedule ============ */
  function renderSchedule(){
    var html = '<div class="day-tabs">';
    DAY_ORDER.forEach(function(d){
      html += '<button class="day-btn'+(ui.day===d?" active":"")+'" data-day="'+d+'">'+d+'</button>';
    });
    html += '</div>';

    var slots = SCHEDULE[ui.day] || [];
    html += '<div>';
    slots.forEach(function(sl){
      var s = sl.subjectId ? subj(sl.subjectId) : null;
      var color = s ? s.color : "var(--idle)";
      html += '<div class="slot">';
      html += '  <div class="time">'+sl.time+'</div>';
      html += '  <div class="stripe" style="background:'+color+'"></div>';
      html += '  <div class="body">';
      html += '    <span class="subj">'+(s?s.name:sl.activity.split(":")[0])+'</span><span class="dur">'+sl.dur+'</span>';
      html += '    <div class="activity">'+sl.activity+'</div>';
      if(sl.note){ html += '    <div class="note">✦ '+sl.note+'</div>'; }
      html += '  </div>';
      html += '</div>';
    });
    html += '</div>';

    if(ui.day==="الأربعاء" || ui.day==="الإثنين" || ui.day==="الثلاثاء"){
      html += '<div class="day-note">تم توسيع مواعيد البلاغة والأدب والنصوص والمطالعة والإنشاء هذا الترم لتغطية الدروس الإضافية المضافة للمنهج، مع الحفاظ على إجمالي وقت مذاكرة معقول يومياً.</div>';
    }
    if(ui.day==="السبت"){
      html += '<div class="day-note">أُضيفت جلسة أسبوعية جديدة لمادة الفقه الشافعي (المختار من الإقناع) في نهاية يوم السبت.</div>';
    }

    document.getElementById("view-schedule").innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll("[data-day]"), function(el){
      el.addEventListener("click", function(){
        ui.day = el.getAttribute("data-day");
        renderSchedule();
      });
    });
  }

  /* ============ TABS ============ */
  function renderTabs(){
    Array.prototype.forEach.call(document.querySelectorAll("nav.tabs button"), function(btn){
      btn.classList.toggle("active", btn.getAttribute("data-tab")===ui.tab);
    });
    ["dashboard","lessons","schedule"].forEach(function(t){
      document.getElementById("view-"+t).classList.toggle("active", t===ui.tab);
    });
  }

  document.querySelectorAll("nav.tabs button").forEach(function(btn){
    btn.addEventListener("click", function(){
      ui.tab = btn.getAttribute("data-tab");
      renderAll();
      window.scrollTo({top:0, behavior:"smooth"});
    });
  });

  function renderAll(){
    renderHeader();
    renderTabs();
    if(ui.tab==="dashboard") renderDashboard();
    if(ui.tab==="lessons") renderLessons();
    if(ui.tab==="schedule") renderSchedule();
  }

  renderAll();
})();
</script></body></html>
